name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Rename APK files
        run: |
          cp app/build/outputs/apk/release/app-release.apk seedCE-${{ github.ref_name }}.apk
          ls -la *.apk

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign APK with Cosign (keyless)
        run: |
          cosign sign-blob --yes "seedCE-${{ github.ref_name }}.apk" \
            > "seedCE-${{ github.ref_name }}.apk.sig" 2>&1
          cat "seedCE-${{ github.ref_name }}.apk.sig"
          ls -la *.sig

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            seedCE-${{ github.ref_name }}.apk
            seedCE-${{ github.ref_name }}.apk.sig
          generate_release_notes: true
